version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: rune
    main: ./cmd/rune
    binary: rune
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

brews:
  - name: rune
    repository:
      owner: sidkhuntia
      name: homebrew-tap
      branch: main
      # A PAT with write access to the tap; GITHUB_TOKEN cannot push cross-repo.
      token: "{{ .Env.COMMITTER_TOKEN }}"
    homepage: https://github.com/sidkhuntia/rune
    description: "AI-powered Git commit message generator"
    license: MIT
    install: |
      bin.install "rune"
    test: |
      assert_match version.to_s, shell_output("#{bin}/rune --version")
